[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Netlify Functions need Node >= 18 for the built-in `fetch` used to
  # verify Cloudflare Turnstile tokens in netlify/functions/contact.js.
  NODE_VERSION = "20"

[functions]
  # esbuild inlines the static require() of the knowledge corpus and the
  # RAG engine from public/ into the chat function bundle.
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The corpus only changes on deploy, but keep revalidation cheap and
# explicit so a knowledge update is never masked by a stale browser copy.
[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
