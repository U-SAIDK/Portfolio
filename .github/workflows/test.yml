name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails if knowledge/*.md was edited without rebuilding the corpus.
      - run: npm run check:knowledge

      # Retrieval regressions, handler behaviour, prompt structure.
      - run: npm test
